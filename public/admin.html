<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administrare · CYBERGUARD Quizy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="row grow">
      <a class="brand" href="/"><img src="/img/cyberguard-mark.svg" alt="" width="22" height="35"><span>CYBERGUARD <b>Quizy</b></span></a>
      <strong id="event-title" class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></strong>
    </div>
    <div class="row">
      <span id="online" class="badge live" title="Participanți conectați acum"></span>
      <a id="present-link" class="btn sm" target="_blank" rel="noopener">Ecran de proiecție ↗</a>
      <button id="export" class="sm" type="button">Export CSV</button>
    </div>
  </header>

  <main class="wrap wide">
    <div id="error" class="card hidden"></div>

    <div id="app" class="admin-grid hidden">
      <section>
        <div class="row between" style="margin-bottom:.75rem">
          <h2 style="margin:0">Sondaje și quiz-uri</h2>
          <div class="row">
            <button id="import-polls" type="button">Import în bloc</button>
            <button id="new-poll" class="primary" type="button">+ Sondaj nou</button>
          </div>
        </div>
        <form id="editor" class="card stack hidden"></form>
        <div id="polls" style="margin-top:1rem"></div>
      </section>

      <section>
        <div class="card stack">
          <h2>Ecranul proiectat arată</h2>
          <div id="screen" class="screen-switch"></div>
        </div>

        <div class="card stack">
          <h2>Linkuri</h2>
          <div class="links" id="links"></div>
        </div>

        <div class="card stack">
          <div class="row between">
            <h2 style="margin:0">Întrebări din public</h2>
            <span id="pending-count" class="badge pending hidden"></span>
          </div>
          <label class="check"><input type="checkbox" id="qa-enabled"> Q&amp;A activat</label>
          <label class="check"><input type="checkbox" id="qa-moderation"> Moderare înainte de publicare</label>
          <div class="tabs" id="qa-filter">
            <button type="button" data-f="pending" class="sm">În așteptare</button>
            <button type="button" data-f="visible" class="sm" aria-selected="true">Publicate</button>
            <button type="button" data-f="answered" class="sm">Răspunse</button>
            <button type="button" data-f="archived" class="sm">Arhivate</button>
          </div>
          <div id="questions"></div>
        </div>

        <div class="card stack">
          <h2>🏆 Clasament quiz</h2>
          <div id="leaderboard"></div>
        </div>

        <div class="card stack">
          <h2>Eveniment</h2>
          <form id="rename" class="row">
            <input id="rename-input" class="grow" type="text" maxlength="120" aria-label="Numele evenimentului">
            <button type="submit">Redenumește</button>
          </form>
          <label class="check"><input type="checkbox" id="closed"> Eveniment închis (nu mai primește răspunsuri)</label>
          <button id="delete-event" class="danger" type="button">Șterge evenimentul definitiv</button>
        </div>
      </section>
    </div>
  </main>
  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
