<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="CyberGuard_Logo" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="50%" stop-color="#004C99"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <linearGradient id="aiGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC125"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="1" dy="1"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Group for the shield and AI design -->
  <g transform="translate(20,40) scale(0.8)">
    <!-- Shield Shape -->
    <path id="shield" d="M100,20               C100,20 150,10 200,20              L200,120               C200,160 150,180 150,180              C150,180 100,160 100,120              Z" fill="url(#shieldGradient)" filter="url(#dropShadow)"/>

    <!-- AI Neural Network Design -->
    <g fill="url(#aiGradient)" filter="url(#dropShadow)">
      <!-- Central Nodes -->
      <circle cx="150" cy="60" r="8"/>
      <circle cx="130" cy="80" r="8"/>
      <circle cx="170" cy="80" r="8"/>
      <circle cx="150" cy="100" r="8"/>
      
      <!-- Connecting Lines -->
      <path d="M150,60 L130,80 M150,60 L170,80                 M130,80 L150,100 M170,80 L150,100" stroke="url(#aiGradient)" stroke-width="3" fill="none"/>
            
    </g>

    <!-- SOC text inside shield -->
    <text x="150" y="140" font-family="Arial" font-weight="700" font-size="28px" fill="#FFD700" text-anchor="middle" letter-spacing="3" filter="url(#dropShadow)">
      SOC
    </text>
  </g>

  <!-- Main Text -->
  <text x="220" y="115" font-family="Arial" font-weight="700" font-size="85px" fill="#003366" letter-spacing="3" filter="url(#dropShadow)">
    CYBERGUARD
  </text>

  <!-- Tagline -->
  <text x="230" y="180" font-family="Arial" font-weight="600" font-size="38px" fill="#003366" letter-spacing="3">
    AI-POWERED  DEFENSE
  </text>
</svg>